<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14">
  <defs>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5a0" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1200" height="1.5" fill="#30363d" />
  <rect x="-240" y="5.5" width="240" height="2.5" rx="1.25" fill="url(#pulse)">
    <animate attributeName="x" from="-240" to="1200" dur="3.5s" repeatCount="indefinite" />
  </rect>
</svg>
